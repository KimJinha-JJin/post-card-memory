<title>기억 밀도 재료 비교</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  /* Layout: 휴대폰 세로 한 화면 = 앱 화면. 다섯 재료를 같은 높이 행으로 쌓아 스크롤 없이 비교.
     넓은 화면에서는 같은 비율(390×844)의 폰 틀 안에 담는다. 앱 종이 톤 하나로 고정한 단일 테마. */
  :root {
    --desk: #E3DACA;          /* 폰 틀 바깥 책상 */
    --paper-canvas: #F4ECDE;  /* 앱 종이 배경 */
    --paper-divider: #DBCBB0;
    --ink-primary: #1A1324;
    --ink-secondary: #5B5046;
    --sunset-gold: #8C5F00;
    --font-ui: -apple-system, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--desk);
    color: var(--ink-primary);
    font-family: var(--font-ui);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .device {
    height: 100%;
    width: 100%;
    background: var(--paper-canvas);
    display: flex;
    flex-direction: column;
    padding-block: 14px 10px;
    padding-inline: 16px;
    gap: 6px;
    min-height: 0;
  }
  @media (min-width: 520px) {
    body { padding-block: 16px; box-sizing: border-box; }
    .device {
      height: min(100%, 880px);
      width: auto;
      aspect-ratio: 390 / 844;
      max-width: 100%;
      border-radius: 28px;
      box-shadow: 0 0 0 9px #2B2520, 0 18px 40px rgba(40, 30, 20, 0.28);
    }
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  header h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  header .meta {
    font-size: 11px;
    color: var(--ink-secondary);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .rows {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-rows: repeat(5, minmax(0, 1fr));
  }
  .sample {
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding-block: 6px 4px;
    border-top: 1px dashed var(--paper-divider);
  }
  .sample:first-child { border-top: 0; }
  .sample-label {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 12px;
    line-height: 1.2;
    min-width: 0;
  }
  .sample-label b { font-weight: 700; white-space: nowrap; }
  .sample-label span {
    color: var(--ink-secondary);
    font-size: 10.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .chart-box { flex: 1; min-height: 0; position: relative; }
  .chart-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .ground-line { height: 1px; background: var(--paper-divider); }
  .months { display: flex; gap: 2px; padding-top: 2px; }
  .months div {
    flex: 1;
    min-width: 0;
    text-align: center;
    font-size: 9.5px;
    line-height: 1.1;
    color: var(--ink-secondary);
    font-variant-numeric: tabular-nums;
  }
  footer {
    font-size: 10px;
    line-height: 1.35;
    color: var(--ink-secondary);
    text-align: center;
  }
</style>

<div class="device">
  <header>
    <h1>기억 밀도 · 재료 비교</h1>
    <span class="meta">2026년 · 같은 데이터</span>
  </header>
  <div class="rows" id="rows"></div>
  <footer>재료 질감만 다르고 종이·막대·높이·데이터는 모두 같아요</footer>
</div>

<script>
  // ---------- 고정 비교 조건 (93일차 데스크톱 목업과 같은 데이터) ----------
  const COUNTS = [0, 1, 3, 6, 9, 14, 20, 11, 2, 5, 17, 8];
  const MAX_COUNT = 20;
  const COL_GAP = 2;
  const PLOT_TOP = 3;
  const PAPER_RGB = [0xF4, 0xEC, 0xDE];

  function barRects(W, H) {
    const colW = (W - COL_GAP * 11) / 12;
    const barW = Math.round(colW * 0.55 * 2) / 2;
    const maxH = H - PLOT_TOP;
    return COUNTS.map((c, i) => {
      if (c <= 0) return null;
      const h = Math.max(2.5, (c / MAX_COUNT) * maxH);
      const x = i * (colW + COL_GAP) + (colW - barW) / 2;
      return { i, x, y: H - h, w: barW, h };
    });
  }

  // ---------- 결정적 난수 / 종이 결 ----------
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash2(ix, iy, seed) {
    let h = Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(seed, 2147483647);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  function valueNoise(x, y, seed) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    const a = hash2(ix, iy, seed), b = hash2(ix + 1, iy, seed);
    const c = hash2(ix, iy + 1, seed), d = hash2(ix + 1, iy + 1, seed);
    return (a + (b - a) * sx) + ((c + (d - c) * sx) - (a + (b - a) * sx)) * sy;
  }
  function paperTooth(x, y) {
    const fine = valueNoise(x * 1.15, y * 1.15, 11);
    const mid = valueNoise(x * 0.38, y * 0.38, 23);
    const fiber = valueNoise(x * 0.12, y * 0.9, 37);
    return 0.55 * fine + 0.27 * mid + 0.18 * fiber;
  }
  const paperCache = {};
  function paperField(W, H, scale) {
    const key = W + "x" + H + "@" + scale;
    if (paperCache[key]) return paperCache[key];
    const w = Math.round(W * scale), h = Math.round(H * scale);
    const t = new Float32Array(w * h);
    for (let py = 0; py < h; py++) {
      for (let px = 0; px < w; px++) t[py * w + px] = paperTooth((px + 0.5) / scale, (py + 0.5) / scale);
    }
    return (paperCache[key] = { w, h, t });
  }

  // ---------- 손 스트로크 도구 ----------
  function rulerStroke(ctx, x1, y1, x2, y2, o, rng) {
    const len = Math.hypot(x2 - x1, y2 - y1);
    if (len < 0.3) return;
    const dx = (x2 - x1) / len, dy = (y2 - y1) / len;
    const nx = -dy, ny = dx;
    const step = o.step || 1.2;
    const n = Math.max(2, Math.ceil(len / step));
    const ph1 = rng() * 6.28, ph2 = rng() * 6.28;
    const f1 = 0.08 + rng() * 0.06, f2 = 0.3 + rng() * 0.2;
    const base = o.alpha * (o.pressureMin + rng() * (1 - o.pressureMin));
    let dropLeft = 0, prev = null;
    for (let k = 0; k <= n; k++) {
      const d = (k / n) * len;
      const wob = o.wobble * (0.7 * Math.sin(d * f1 + ph1) + 0.3 * Math.sin(d * f2 + ph2));
      const pt = [x1 + dx * d + nx * wob, y1 + dy * d + ny * wob];
      if (prev) {
        let prof = 1;
        if (o.endDark) prof = 1 + o.endDark * (Math.exp(-d / 1.5) + Math.exp(-(len - d) / 1.5));
        if (o.taper) prof *= Math.min(1, 0.45 + d / o.taper) * Math.min(1, 0.55 + (len - d) / o.taper);
        if (o.dropout && dropLeft <= 0 && rng() < o.dropout) dropLeft = 1 + Math.floor(rng() * 3);
        if (dropLeft > 0) { dropLeft--; prev = pt; continue; }
        const flutter = o.flutter ? 1 - o.flutter * rng() : 1;
        ctx.globalAlpha = Math.min(1, base * prof * flutter);
        ctx.lineWidth = o.width * (o.widthJitter ? 1 + (rng() - 0.5) * o.widthJitter : 1);
        ctx.beginPath();
        ctx.moveTo(prev[0], prev[1]);
        ctx.lineTo(pt[0], pt[1]);
        ctx.stroke();
      }
      prev = pt;
    }
  }
  function hatchRect(ctx, r, o, rng) {
    const ang = (o.angle + (rng() - 0.5) * (o.angleJitter || 0)) * Math.PI / 180;
    const dx = Math.cos(ang), dy = Math.sin(ang);
    const nx = -dy, ny = dx;
    const y0 = r.y + r.h * (o.from || 0), y1 = r.y + r.h * (o.to == null ? 1 : o.to);
    const rect = { x: r.x, y: y0, w: r.w, h: y1 - y0 };
    if (rect.h <= 0.5) return;
    const cs = [[rect.x, rect.y], [rect.x + rect.w, rect.y], [rect.x, rect.y + rect.h], [rect.x + rect.w, rect.y + rect.h]]
      .map(([x, y]) => x * nx + y * ny);
    const cMin = Math.min(...cs), cMax = Math.max(...cs);
    for (let c = cMin + o.spacing * rng(); c < cMax; c += o.spacing * (0.8 + 0.4 * rng())) {
      const px = nx * c, py = ny * c;
      let t0 = -1e9, t1 = 1e9;
      const clipAxis = (p, d, lo, hi) => {
        if (Math.abs(d) < 1e-9) return p >= lo && p <= hi;
        let a = (lo - p) / d, b = (hi - p) / d;
        if (a > b) [a, b] = [b, a];
        t0 = Math.max(t0, a); t1 = Math.min(t1, b);
        return t0 <= t1;
      };
      if (!clipAxis(px, dx, rect.x, rect.x + rect.w)) continue;
      if (!clipAxis(py, dy, rect.y, rect.y + rect.h)) continue;
      let e0 = t0 - (o.overshoot * rng() - o.shortfall * rng());
      let e1 = t1 + (o.overshoot * rng() - o.shortfall * rng());
      if (o.from) {
        const cut = rng() * Math.min(rect.h * 0.45, 14);
        if (dy * (e1 - e0) > 0) e0 = Math.min(e1, e0 + cut / Math.abs(dy)); else e1 = Math.max(e0, e1 - cut / Math.abs(dy));
      }
      rulerStroke(ctx, px + dx * e0, py + dy * e0, px + dx * e1, py + dy * e1, o, rng);
    }
  }
  function outlineRect(ctx, r, o, rng, sides) {
    const ov = () => o.cornerOver * (rng() * 1.2 - 0.2);
    const L = r.x, R = r.x + r.w, T = r.y, B = r.y + r.h;
    const all = { left: [L, B + 0.2, L, T - ov()], top: [L - ov(), T, R + ov(), T], right: [R, T - ov(), R, B + 0.2] };
    (sides || ["left", "top", "right"]).forEach((s) => {
      const [x1, y1, x2, y2] = all[s];
      if (rng() < 0.5) rulerStroke(ctx, x1, y1, x2, y2, o, rng);
      else rulerStroke(ctx, x2, y2, x1, y1, o, rng);
    });
  }

  // ---------- 재료 (데스크톱 목업과 같은 값) ----------
  const MATERIALS = [
    {
      name: "A 연필", desc: "흑연 · 종이 결 비침 · 사선 손칠",
      ink: [0x3B, 0x3A, 0x40], maxOpacity: 0.88, seed: 101,
      tooth: { strength: 0.75, center: 0.5, soft: 0.13, fillIn: 0.45 },
      draw(ctx, bars, rng) {
        ctx.lineCap = "butt";
        bars.forEach((r) => {
          if (!r) return;
          hatchRect(ctx, r, { angle: -58, angleJitter: 4, spacing: 1.35, width: 0.95, alpha: 0.55,
            pressureMin: 0.45, wobble: 0.18, overshoot: 0.5, shortfall: 0.9, taper: 2.2, flutter: 0.25 }, rng);
          if (r.h > 10) hatchRect(ctx, r, { angle: -48, angleJitter: 6, spacing: 1.9, width: 0.95, alpha: 0.4,
            pressureMin: 0.4, wobble: 0.2, overshoot: 0.4, shortfall: 1.2, taper: 2.2, flutter: 0.3,
            from: 0.25 + rng() * 0.35, to: 1 }, rng);
          outlineRect(ctx, r, { width: 0.95, alpha: 0.85, pressureMin: 0.7, wobble: 0.12, cornerOver: 1.4,
            taper: 3, flutter: 0.15, step: 1 }, rng);
        });
      },
    },
    {
      name: "B 색연필", desc: "안료가 요철에 걸림 · 겹칠수록 진함",
      ink: [0xB0, 0x5E, 0x3A], maxOpacity: 0.92, seed: 202,
      tooth: { strength: 0.8, center: 0.47, soft: 0.11, fillIn: 0.5 },
      draw(ctx, bars, rng) {
        ctx.lineCap = "butt";
        bars.forEach((r) => {
          if (!r) return;
          hatchRect(ctx, r, { angle: -66, angleJitter: 3, spacing: 1.5, width: 1.6, alpha: 0.45,
            pressureMin: 0.35, wobble: 0.22, overshoot: 0.7, shortfall: 0.8, taper: 3, flutter: 0.3, widthJitter: 0.3 }, rng);
          hatchRect(ctx, r, { angle: -62, angleJitter: 5, spacing: 1.7, width: 1.6, alpha: 0.38,
            pressureMin: 0.3, wobble: 0.22, overshoot: 0.6, shortfall: 1.0, taper: 3, flutter: 0.35, widthJitter: 0.3,
            from: rng() * 0.25, to: 0.75 + rng() * 0.25 }, rng);
          if (r.h > 30) hatchRect(ctx, r, { angle: -70, angleJitter: 4, spacing: 2.0, width: 1.5, alpha: 0.32,
            pressureMin: 0.3, wobble: 0.2, overshoot: 0.5, shortfall: 1.2, taper: 3, flutter: 0.35,
            from: 0.55 + rng() * 0.2, to: 1 }, rng);
          outlineRect(ctx, r, { width: 1.1, alpha: 0.55, pressureMin: 0.6, wobble: 0.14, cornerOver: 1.0,
            taper: 3, flutter: 0.25, step: 1 }, rng);
        });
      },
    },
    {
      name: "C 크레파스", desc: "두툼한 왁스 · 굵은 결 · 미세한 빈틈",
      ink: [0xBE, 0x67, 0x38], maxOpacity: 0.92, seed: 303,
      tooth: { strength: 0.9, center: 0.43, soft: 0.07, fillIn: 0.2 },
      draw(ctx, bars, rng) {
        ctx.lineCap = "butt";
        bars.forEach((r) => {
          if (!r) return;
          outlineRect(ctx, r, { width: 2.4, alpha: 0.6, pressureMin: 0.6, wobble: 0.22, cornerOver: 0.6,
            flutter: 0.2, step: 1.4 }, rng);
          hatchRect(ctx, r, { angle: -22, angleJitter: 5, spacing: 2.5, width: 3.0, alpha: 0.5,
            pressureMin: 0.5, wobble: 0.3, overshoot: 0.9, shortfall: 0.6, flutter: 0.2, widthJitter: 0.35, step: 1.4 }, rng);
          hatchRect(ctx, r, { angle: -28, angleJitter: 8, spacing: 3.2, width: 3.0, alpha: 0.4,
            pressureMin: 0.4, wobble: 0.3, overshoot: 0.6, shortfall: 1.2, flutter: 0.25, widthJitter: 0.35, step: 1.4,
            from: 0.3 + rng() * 0.4, to: 1 }, rng);
          if (rng() < 0.45 && r.h > 12) {
            ctx.globalAlpha = 0.55;
            ctx.beginPath();
            ctx.ellipse(r.x + 2 + rng() * (r.w - 4), r.y + 3 + rng() * (r.h - 6), 1.1 + rng() * 0.6, 0.7 + rng() * 0.4, rng() * 3, 0, 6.29);
            ctx.fill();
          }
          if (rng() < 0.3) {
            ctx.globalAlpha = 0.45;
            const side = rng() < 0.5 ? r.x - 1.6 : r.x + r.w + 1.6;
            ctx.beginPath();
            ctx.arc(side, r.y + rng() * r.h, 0.55 + rng() * 0.3, 0, 6.29);
            ctx.fill();
          }
        });
      },
    },
    {
      name: "D 볼펜", desc: "자 대고 그은 외곽 · 드문 끊김 · 볼펜똥 3군데",
      ink: [0x24, 0x33, 0x7E], maxOpacity: 0.95, seed: 404,
      tooth: { strength: 0.18, center: 0.4, soft: 0.2, fillIn: 0.2 },
      draw(ctx, bars, rng) {
        ctx.lineCap = "butt";
        const blobBars = new Set([6, 10, 3]);
        bars.forEach((r) => {
          if (!r) return;
          hatchRect(ctx, r, { angle: -55, angleJitter: 2, spacing: 1.3, width: 0.62, alpha: 0.68,
            pressureMin: 0.65, wobble: 0.1, overshoot: 0.45, shortfall: 0.5, endDark: 0.5, dropout: 0.012, flutter: 0.15, step: 1 }, rng);
          if (r.h > 20) hatchRect(ctx, r, { angle: -55, angleJitter: 3, spacing: 2.6, width: 0.62, alpha: 0.5,
            pressureMin: 0.6, wobble: 0.12, overshoot: 0.4, shortfall: 0.8, endDark: 0.5, dropout: 0.015, flutter: 0.15, step: 1,
            from: 0.4 + rng() * 0.3, to: 1 }, rng);
          const line = { width: 0.8, alpha: 0.85, pressureMin: 0.8, wobble: 0.08, cornerOver: 2.0,
            endDark: 0.45, dropout: 0.01, flutter: 0.1, step: 1 };
          outlineRect(ctx, r, line, rng);
          if (rng() < 0.4) outlineRect(ctx, r, { ...line, alpha: 0.5, cornerOver: 0.8 }, rng, [rng() < 0.5 ? "left" : "right"]);
          if (blobBars.has(r.i)) {
            const bx = rng() < 0.5 ? r.x : r.x + r.w;
            const by = r.y + (rng() < 0.6 ? 0 : r.h * (0.3 + rng() * 0.4));
            ctx.globalAlpha = 0.95;
            ctx.beginPath();
            ctx.ellipse(bx + 0.3, by + 0.2, 1.05, 0.8, rng() * 3, 0, 6.29);
            ctx.fill();
            ctx.globalAlpha = 0.6;
            ctx.lineWidth = 0.7;
            ctx.beginPath();
            ctx.moveTo(bx + 0.3, by + 0.2);
            ctx.lineTo(bx + 1.6 + rng(), by - 0.5 - rng() * 0.6);
            ctx.stroke();
          }
        });
      },
    },
    {
      name: "E 중성펜", desc: "매끈하고 일정한 잉크 · 뭉침 없음 (선택)",
      ink: [0x1F, 0x1C, 0x24], maxOpacity: 0.9, seed: 505,
      tooth: { strength: 0.06, center: 0.4, soft: 0.2, fillIn: 0.2 },
      draw(ctx, bars, rng) {
        ctx.lineCap = "round";
        bars.forEach((r) => {
          if (!r) return;
          hatchRect(ctx, r, { angle: -55, angleJitter: 1.5, spacing: 2.1, width: 0.75, alpha: 0.62,
            pressureMin: 0.9, wobble: 0.14, overshoot: 0.35, shortfall: 0.4, step: 1.6 }, rng);
          outlineRect(ctx, r, { width: 0.95, alpha: 0.9, pressureMin: 0.92, wobble: 0.1, cornerOver: 1.2, step: 1.6 }, rng);
        });
      },
    },
  ];

  function smoothstep(a, b, x) {
    const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  }

  function renderMaterial(canvas, mat, W, H, scale) {
    const paper = paperField(W, H, scale);
    const { w, h } = paper;
    canvas.width = w; canvas.height = h;
    const off = document.createElement("canvas");
    off.width = w; off.height = h;
    const octx = off.getContext("2d");
    octx.setTransform(scale, 0, 0, scale, 0, 0);
    octx.strokeStyle = "#000";
    octx.fillStyle = "#000";
    mat.draw(octx, barRects(W, H), mulberry32(mat.seed));
    const pig = octx.getImageData(0, 0, w, h).data;
    const ctx = canvas.getContext("2d");
    const out = ctx.createImageData(w, h);
    const d = out.data, tc = mat.tooth;
    for (let p = 0; p < w * h; p++) {
      const T = paper.t[p];
      const shade = 1 + (T - 0.5) * 0.06;
      const pr = PAPER_RGB[0] * shade, pg = PAPER_RGB[1] * shade, pb = PAPER_RGB[2] * shade;
      const A = pig[p * 4 + 3] / 255;
      let dep = 0;
      if (A > 0) {
        const edge = tc.center - A * tc.fillIn;
        dep = A * (1 - tc.strength + tc.strength * smoothstep(edge - tc.soft, edge + tc.soft, T)) * mat.maxOpacity;
      }
      d[p * 4] = pr + (mat.ink[0] - pr) * dep;
      d[p * 4 + 1] = pg + (mat.ink[1] - pg) * dep;
      d[p * 4 + 2] = pb + (mat.ink[2] - pb) * dep;
      d[p * 4 + 3] = 255;
    }
    ctx.putImageData(out, 0, 0);
  }

  // ---------- 화면 구성 ----------
  const rowsEl = document.getElementById("rows");
  const samples = MATERIALS.map((mat) => {
    const el = document.createElement("section");
    el.className = "sample";
    el.innerHTML =
      '<div class="sample-label"><b>' + mat.name + '</b><span>' + mat.desc + '</span></div>' +
      '<div class="chart-box"><canvas></canvas></div><div class="ground-line"></div>' +
      '<div class="months">' + Array.from({ length: 12 }, (_, i) => "<div>" + (i + 1) + "</div>").join("") + "</div>";
    rowsEl.appendChild(el);
    return { mat, box: el.querySelector(".chart-box"), canvas: el.querySelector("canvas") };
  });

  function renderAll() {
    const scale = Math.min(3, Math.max(1, Math.round(window.devicePixelRatio || 1)));
    samples.forEach(({ mat, box, canvas }) => {
      const W = Math.floor(box.clientWidth), H = Math.floor(box.clientHeight);
      if (W < 20 || H < 10) return;
      renderMaterial(canvas, mat, W, H, scale);
    });
  }

  let resizeTimer = 0;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderAll, 120);
  });
  renderAll();
</script>
