<title>오늘 방문 색 고르기</title>
<style>
:root{
  --bg:#f1ece4; --paper:#fffbf3; --ink:#1a1324; --ink-secondary:#5b5046;
  --divider:#dbcbb0; --sat:#30415f; --sun:#b33a32; --teal:#16a7a1;
  --card-border:#e4dac8; --accent:#16a7a1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#20201d; --paper:#2a2924; --ink:#f1ece4; --ink-secondary:#b8ac97;
    --divider:#4a4438; --sat:#7f9bc4; --sun:#e08a80; --teal:#3fc2bb;
    --card-border:#3c3a32; --accent:#3fc2bb;
  }
}
:root[data-theme="dark"]{
  --bg:#20201d; --paper:#2a2924; --ink:#f1ece4; --ink-secondary:#b8ac97;
  --divider:#4a4438; --sat:#7f9bc4; --sun:#e08a80; --teal:#3fc2bb;
  --card-border:#3c3a32; --accent:#3fc2bb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',Arial,'Malgun Gothic',sans-serif;padding:32px 20px 56px}
main{max-width:1000px;margin:0 auto}
h1{font-size:22px;font-weight:600;margin:0 0 6px;text-wrap:balance}
p.lede{font-size:14px;line-height:1.7;color:var(--ink-secondary);margin:0 0 28px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:820px){.grid{grid-template-columns:1fr;max-width:320px;margin:0 auto}}
.card{background:var(--paper);border:1px solid var(--card-border);border-radius:8px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:14px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px}
.swatch{width:14px;height:14px;border-radius:3px;flex:none;display:inline-block}
.hex{font-family:Consolas,'SF Mono',monospace;font-size:12px;color:var(--ink-secondary);margin:0}
.paper-mini{background:var(--paper);padding:14px 16px;border-radius:2px}
.month{font-size:13px;font-weight:500;color:var(--ink)}
.subtitle{font-size:8.5px;color:var(--ink-secondary);margin-top:1px}
.ornament{height:16px;display:flex;align-items:center;gap:5px;color:var(--ink-secondary);opacity:.5;font-size:8px;margin-top:1px}
.ornament .line{height:.5px;flex:1;background:currentColor}
.weekdays,.week{display:grid;grid-template-columns:repeat(7,1fr)}
.weekdays{font-size:9px;text-align:center;margin-bottom:5px;color:var(--ink-secondary)}
.cell{height:30px;position:relative;text-align:center}
.fill{position:absolute;inset:2.5px;border-radius:2px;background:var(--teal)}
.fill.today{background:var(--this-hex)}
.number{position:absolute;top:2px;left:0;right:0;font-size:9.5px;line-height:normal;color:var(--ink-secondary)}
.face{position:absolute;bottom:1px;left:0;right:0;font-size:6.5px;white-space:nowrap;line-height:normal}
.visited .number,.visited .face{color:#f3f1ea}
.sat .number{color:var(--sat)}
.sun .number{color:var(--sun)}
.week-rule{height:.5px;background:var(--divider);opacity:.4;margin:1.5px 0}
.footer{font-size:9px;color:var(--ink-secondary);padding-top:4px}
.verdict{font-size:11.5px;color:var(--ink-secondary);line-height:1.6;margin:0}
.legend{display:flex;gap:20px;flex-wrap:wrap;margin:26px 0 0;font-size:12.5px;color:var(--ink-secondary)}
.legend .dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
</style>
<main>
<h1>오늘 방문 색, 세 후보 중 하나만 골라줘</h1>
<p class="lede">방문 달력의 오늘 칸만 기존 <code>#16A7A1</code>보다 한 톤 진한 같은 청록 계열로 바꾸는 안이야. 9/10~9/16 연속 방문(오늘 = 9/16)을 그대로 두고 오늘 칸 색만 세 가지로 바꿔봤어. 라벨 모양·2dp·자동 대비는 그대로.</p>
<section class="grid" id="grid"></section>
<div class="legend">
  <span><i class="dot" style="background:#16a7a1"></i>일반 방문 (기존, 안 바뀜)</span>
  <span><i class="dot" style="background:#30415f"></i>토요일</span>
  <span><i class="dot" style="background:#b33a32"></i>일요일</span>
</div>
</main>
<script>
const faces=['•ᴗ•','˙ᵕ˙','ᵔᴗᵔ','ᵔ.ᵔ'];
const TODAY=16;
const visited=[10,11,12,13,14,15,16];
const candidates=[
  {name:'A · 은은하게', hex:'#13908B', note:'기존 청록에 가장 가까운 톤. 구분은 되지만 아주 조용해.'},
  {name:'B · 또렷하게', hex:'#117E7A', note:'일반 방문과 확실히 구분되면서도 너무 어둡진 않아.'},
  {name:'C · 진하게', hex:'#0E6C68', note:'가장 진한 톤. 존재감은 크지만 튀는 느낌이 날 수 있어.'}
];
const grid=document.getElementById('grid');
candidates.forEach(cand=>{
  const dates=[...Array(2).fill(null),...Array.from({length:30},(_,i)=>i+1)];
  const weeks=Array.from({length:5},(_,w)=>dates.slice(w*7,w*7+7));
  const weeksHtml=weeks.map((week,wi)=>{
    const cells=week.map(day=>{
      if(!day) return '<div class="cell"></div>';
      const dow=new Date(Date.UTC(2026,8,day)).getUTCDay();
      const isVisited=visited.includes(day), isToday=day===TODAY;
      const dowCls=dow===0?'sun':dow===6?'sat':'';
      const cls=[isVisited?'visited':'',dowCls].filter(Boolean).join(' ');
      const face=faces[((day)%4+4)%4];
      return `<div class="cell ${cls}">${isVisited?`<div class="fill${isToday?' today':''}" ${isToday?`style="--this-hex:${cand.hex}"`:''}></div>`:''}<span class="number">${day}</span>${isVisited?`<span class="face">${face}</span>`:''}</div>`;
    }).join('');
    return `<div class="week">${cells}</div>${wi<4?'<div class="week-rule"></div>':''}`;
  }).join('');
  const card=document.createElement('div');
  card.className='card';
  card.innerHTML=`
    <h2><span class="swatch" style="background:${cand.hex}"></span>${cand.name}</h2>
    <p class="hex">${cand.hex}</p>
    <div class="paper-mini">
      <div class="month">2026년 9월</div>
      <div class="subtitle">다녀간 날들</div>
      <div class="ornament"><span class="line"></span><span>✦</span><span class="line"></span></div>
      <div class="weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      ${weeksHtml}
      <div class="footer">오늘까지 ${visited.length}번 만났어요~!</div>
    </div>
    <p class="verdict">${cand.note}</p>
  `;
  grid.appendChild(card);
});
</script>
