name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# 같은 PR의 이전 실행만 취소한다. main push·수동 실행은 run마다 고유 그룹이라 서로 취소되지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 검증 범위 판정(gh api)에 필요한 읽기 권한만 둔다.
permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  # 필수 체크 이름. job은 항상 실행되고, 범위 판정에 따라 빌드 단계만 생략될 수 있다.
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # 판정에 대상 commit과 부모 commit이 필요하다(PR은 기준 main·PR head, main push는 직전 main·PR head).
          fetch-depth: 2

      # PR의 commit마다 새로 추가된 줄에서 민감정보(기기 식별자·개인 경로·이메일·인증정보)를 찾는다.
      # 빌드 범위 판정과 무관하게 PR이면 항상 실행되며, 감지되면 필수 체크가 실패해 병합이 막힌다.
      # 이력 전체가 필요하므로 별도 폴더에 blob 없이 받아 .github만 꺼낸다(본 checkout·빌드에는 영향 없음).
      - name: Checkout PR history for sensitive-info scan
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .scan-history
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github

      - name: Scan PR commits for sensitive info
        if: github.event_name == 'pull_request'
        working-directory: .scan-history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # PR이 자기 검사를 약하게 바꾸지 못하도록 기준(main) 쪽 검사 스크립트를 우선 사용한다.
          scanner=$(mktemp)
          if git show "$BASE_SHA:.github/scripts/sensitive-info-scan.sh" > "$scanner" 2>/dev/null; then
            echo "기준 브랜치의 검사 스크립트 사용"
          else
            cp .github/scripts/sensitive-info-scan.sh "$scanner"
            echo "기준 브랜치에 검사 스크립트가 없어 PR의 스크립트 사용"
          fi
          bash "$scanner" --range "$BASE_SHA" "$HEAD_SHA"

      - name: Decide verification scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          WORKFLOW_PATH: .github/workflows/android-ci.yml
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ci-verification-scope.sh

      # 아래 단계는 판정이 명시적으로 full=false일 때만 생략된다(출력이 없으면 전체 검증).
      - name: Set up JDK 17
        if: steps.scope.outputs.full != 'false'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          check-latest: true

      - name: Verify Android SDK platform/build-tools already present
        if: steps.scope.outputs.full != 'false'
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      # 빌드를 생략하는 실행에서는 Gradle 캐시를 건드리지 않도록 설정 단계도 함께 생략한다.
      - name: Set up Gradle
        if: steps.scope.outputs.full != 'false'
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: "9.9.1"
          cache-provider: basic

      - name: Run JVM unit tests
        if: steps.scope.outputs.full != 'false'
        run: gradle testDebugUnitTest --console=plain

      - name: Assemble debug APK
        if: steps.scope.outputs.full != 'false'
        run: gradle assembleDebug --console=plain

      - name: Compile instrumentation tests (assembleDebugAndroidTest)
        if: steps.scope.outputs.full != 'false'
        run: gradle assembleDebugAndroidTest --console=plain
