name: Apply photo drawer fix

on:
  push:
    branches:
      - feature/photo-sticker
    paths:
      - .github/workflows/apply-photo-drawer-fix.yml

permissions:
  contents: write

jobs:
  patch-detail-screen:
    runs-on: ubuntu-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/photo-sticker

      - name: Move sticker picker into second photo drawer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/postcardmemory/ui/detail/DetailScreen.kt")
          raw = path.read_bytes()
          newline = "\r\n" if b"\r\n" in raw else "\n"
          text = raw.decode("utf-8").replace("\r\n", "\n")

          text = text.replace(
              "import androidx.compose.foundation.clickable\n",
              "import androidx.compose.foundation.clickable\nimport androidx.compose.foundation.horizontalScroll\n",
              1,
          )
          text = text.replace(
              "import androidx.compose.foundation.layout.Box\n",
              "import androidx.compose.foundation.layout.Box\nimport androidx.compose.foundation.layout.BoxWithConstraints\n",
              1,
          )
          text = text.replace(
              "import androidx.compose.foundation.layout.size\n",
              "import androidx.compose.foundation.layout.size\nimport androidx.compose.foundation.layout.width\n",
              1,
          )

          old = '''                DetailDrawer(
                    title = "레이아웃 꾸미기",
                    summary = selectedLayout.label,
                    expanded =
                        openedDrawerName ==
                                DetailDrawerSection
                                    .LAYOUT
                                    .name,
                    enabled = controlsEnabled,
                    onClick = {
                        openedDrawerName =
                            if (
                                openedDrawerName ==
                                DetailDrawerSection
                                    .LAYOUT
                                    .name
                            ) {
                                ""
                            } else {
                                DetailDrawerSection
                                    .LAYOUT
                                    .name
                            }
                    },
                    modifier =
                        Modifier.fillMaxWidth(0.92f)
                ) {
                    PostcardLayoutPicker(
                        selectedLayout =
                            selectedLayout,
                        onLayoutSelected = { layout ->
                            viewModel.updateLayoutStyle(
                                layout.name
                            )
                        },
                        enabled = controlsEnabled,
                        modifier =
                            Modifier.fillMaxWidth()
                    )
                }
'''

          new = '''                DetailDrawer(
                    title = "사진 꾸미기",
                    summary = "${selectedLayout.label} · 옆으로 밀어 스티커",
                    expanded =
                        openedDrawerName ==
                                DetailDrawerSection
                                    .LAYOUT
                                    .name,
                    enabled = controlsEnabled,
                    onClick = {
                        openedDrawerName =
                            if (
                                openedDrawerName ==
                                DetailDrawerSection
                                    .LAYOUT
                                    .name
                            ) {
                                ""
                            } else {
                                DetailDrawerSection
                                    .LAYOUT
                                    .name
                            }
                    },
                    modifier =
                        Modifier.fillMaxWidth(0.92f)
                ) {
                    Column(
                        modifier = Modifier.fillMaxWidth()
                    ) {
                        Text(
                            text = "첫 번째 칸은 레이아웃, 오른쪽 두 번째 칸은 스티커 사진이야.",
                            color = BrutalDeepViolet,
                            fontSize = 12.sp,
                            fontWeight = FontWeight.Bold,
                            modifier = Modifier.padding(
                                start = 4.dp,
                                end = 4.dp,
                                bottom = 10.dp
                            )
                        )

                        BoxWithConstraints(
                            modifier = Modifier.fillMaxWidth()
                        ) {
                            val drawerWidth = maxWidth

                            Row(
                                modifier = Modifier
                                    .fillMaxWidth()
                                    .horizontalScroll(
                                        rememberScrollState()
                                    ),
                                horizontalArrangement =
                                    Arrangement.spacedBy(12.dp)
                            ) {
                                Box(
                                    modifier =
                                        Modifier.width(drawerWidth)
                                ) {
                                    PostcardLayoutPicker(
                                        selectedLayout =
                                            selectedLayout,
                                        onLayoutSelected = { layout ->
                                            viewModel.updateLayoutStyle(
                                                layout.name
                                            )
                                        },
                                        enabled = controlsEnabled,
                                        modifier =
                                            Modifier.fillMaxWidth()
                                    )
                                }

                                Box(
                                    modifier =
                                        Modifier.width(drawerWidth)
                                ) {
                                    PhotoStickerPickerPanel(
                                        enabled = controlsEnabled,
                                        modifier =
                                            Modifier.fillMaxWidth()
                                    )
                                }
                            }
                        }
                    }
                }
'''

          if old not in text:
              raise SystemExit("Expected layout drawer block was not found; refusing to rewrite the file.")

          text = text.replace(old, new, 1)
          path.write_bytes(text.replace("\n", newline).encode("utf-8"))
          PY

      - name: Commit generated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/postcardmemory/ui/detail/DetailScreen.kt
          git commit -m "Move sticker picker into photo drawer"
          git push origin feature/photo-sticker
